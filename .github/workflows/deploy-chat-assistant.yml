name: Deploy Chat Assistant Lambda

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::974724840334:role/gh-actions-deploy-role
          aws-region: us-east-2

      - name: SAM Build
        working-directory: .
        run: sam build --use-container

      - name: SAM Deploy
        working-directory: .
        env:
          ATLAS_URI_DEV: ${{ secrets.ATLAS_URI_DEV }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          BEDROCK_MODEL_ARN: ${{ secrets.BEDROCK_MODEL_ARN }}
        run: |
          set -euo pipefail

          PARAM_OVERRIDES="Environment=dev AtlasUri=${ATLAS_URI_DEV} PostgresHost=${POSTGRES_HOST} PostgresPassword=${POSTGRES_PASSWORD} CorsAllowOrigin=https://www.learn-ia.app"

          if [ -n "${BEDROCK_MODEL_ARN:-}" ]; then
            echo "Using BedrockModelArn override from secret."
            PARAM_OVERRIDES="${PARAM_OVERRIDES} BedrockModelArn=${BEDROCK_MODEL_ARN}"
          else
            echo "Secret BEDROCK_MODEL_ARN not set; using template default."
          fi

          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name learnia-chat-assistant-dev \
            --region us-east-2 \
            --s3-bucket learnia-sam-artifacts-us-east-2 \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides ${PARAM_OVERRIDES}

      - name: Show outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name learnia-chat-assistant-dev \
            --region us-east-2 \
            --query 'Stacks[0].Outputs' \
            --output table
